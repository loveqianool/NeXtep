name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: ubuntu-latest migrates to 26.04 on 2026-10-19; stay on 24.04
    # where the preinstalled Android SDK layout is known good.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies + build outputs between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NOTE: the runner image already ships a full Android SDK (ANDROID_HOME
      # is set); AGP auto-installs any missing platform/build-tools itself.

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            "NeXtep-freewindow-${GITHUB_REF_NAME}-debug.apk"
          ls -lh NeXtep-freewindow-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: nextep-freewindow-apk
          path: NeXtep-freewindow-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: NeXtep-freewindow-*.apk
          generate_release_notes: true
